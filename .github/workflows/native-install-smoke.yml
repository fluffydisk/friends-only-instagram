name: Existing native APK installation check

on:
  workflow_call:
    inputs:
      source_run_id:
        description: 'Run containing the existing native APK artifact (no rebuild)'
        required: false
        type: string
        default: '38968571288'
      artifact_name:
        description: 'Existing personal APK artifact name'
        required: false
        type: string
        default: 'friends-only-personal-test-apk-17'
      android_api:
        description: 'Stock Google APIs emulator system image; not Samsung One UI'
        required: false
        type: string
        default: '37.0'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Run containing the existing native APK artifact (no rebuild)'
        required: true
        type: string
        default: '38968571288'
      artifact_name:
        description: 'Existing personal APK artifact name'
        required: true
        type: string
        default: 'friends-only-personal-test-apk-17'
      android_api:
        description: 'Stock Google APIs emulator system image; not Samsung One UI'
        required: true
        type: choice
        default: '37.0'
        options:
          - '37.0'
          - '35'

permissions:
  contents: read
  actions: read

concurrency:
  group: native-install-smoke-${{ github.ref }}-${{ inputs.android_api }}
  cancel-in-progress: true

jobs:
  install-existing-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_ARTIFACT_NAME: ${{ inputs.artifact_name }}
      SMOKE_ANDROID_API: ${{ inputs.android_api }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate existing artifact selection
        shell: python
        run: |
          import os, pathlib, re
          if not re.fullmatch(r'[1-9][0-9]*', os.environ['SOURCE_RUN_ID']):
              raise SystemExit('Source run ID must be a positive integer.')
          if not re.fullmatch(r'friends-only-personal-test-apk-[1-9][0-9]*', os.environ['SOURCE_ARTIFACT_NAME']):
              raise SystemExit('Select an existing personal test APK artifact.')
          if os.environ['SMOKE_ANDROID_API'] not in ('35', '37.0'):
              raise SystemExit('Only the listed stock emulator images are supported.')
          pathlib.Path('native-install-reports').mkdir()
      - name: Download the existing APK without rebuilding or signing
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: native-install-input
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Record exact input identity and test scope
        shell: python
        run: |
          import hashlib, json, os, pathlib
          root = pathlib.Path('native-install-input')
          apk = root / 'friends-only-personal.apk'
          entries = list(root.rglob('*'))
          if entries != [apk] or not apk.is_file() or apk.is_symlink():
              raise SystemExit('Expected exactly friends-only-personal.apk in the artifact.')
          digest = hashlib.file_digest(apk.open('rb'), 'sha256').hexdigest()
          record = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'source_run_id': os.environ['SOURCE_RUN_ID'],
              'source_artifact_name': os.environ['SOURCE_ARTIFACT_NAME'],
              'apk_sha256': digest,
              'apk_size_bytes': apk.stat().st_size,
              'requested_system_image': 'system-images;android-' + os.environ['SMOKE_ANDROID_API'] + ';google_apis;x86_64',
              'test_scope': 'One ordinary adb installation on a fresh stock emulator; no app launch, login, or Samsung One UI coverage.',
              'apk_rebuilt_or_resigned': False,
          }
          pathlib.Path('native-install-reports/input-and-scope.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record, indent=2))
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare stock emulator image and free hosted runner space
        shell: bash
        run: |
          df -h / | tee native-install-reports/disk-before.txt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
          df -h / | tee native-install-reports/disk-after.txt
          image="system-images;android-${SMOKE_ANDROID_API};google_apis;x86_64"
          if ! sdkmanager "$image" 2>&1 | tee native-install-reports/system-image-download.txt; then
            sdkmanager "$image" 2>&1 | tee native-install-reports/system-image-retry.txt
          fi
          sudo chmod a+rw /dev/kvm
      - name: Prepare installation and failure diagnostics script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/friends-only-existing-apk-smoke.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          collect_failure_diagnostics() {
            result=$?
            trap - EXIT
            printf '%s\n' "$result" > native-install-reports/install-script-exit-code.txt
            if [ "$result" -ne 0 ]; then
              adb logcat -d -v threadtime > native-install-reports/failure-logcat.txt 2>&1 || true
              adb shell dumpsys package installs > native-install-reports/failure-install-sessions.txt 2>&1 || true
              adb shell dumpsys package > native-install-reports/failure-package-manager.txt 2>&1 || true
            fi
            exit "$result"
          }
          trap collect_failure_diagnostics EXIT
          adb shell getprop ro.build.version.sdk > native-install-reports/device-sdk.txt
          adb shell getprop ro.build.version.release > native-install-reports/device-android-release.txt
          adb shell getprop ro.product.cpu.abilist > native-install-reports/device-abis.txt
          python3 - <<'PY'
          import os, pathlib
          reports = pathlib.Path('native-install-reports')
          actual_sdk = (reports / 'device-sdk.txt').read_text().strip()
          expected_sdk = os.environ['SMOKE_ANDROID_API'].split('.')[0]
          if actual_sdk != expected_sdk:
              raise SystemExit('Wrong device SDK: ' + actual_sdk + ', expected ' + expected_sdk)
          abis = (reports / 'device-abis.txt').read_text().strip().split(',')
          if 'arm64-v8a' not in abis:
              raise SystemExit('The stock image does not advertise arm64-v8a support; this APK cannot be tested here.')
          PY
          adb install --no-streaming native-install-input/friends-only-personal.apk 2>&1 | tee native-install-reports/adb-install.txt
          SH
      - name: Install existing APK once on a fresh stock emulator
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.android_api }}
          system-image-api-level: ${{ inputs.android_api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash "$RUNNER_TEMP/friends-only-existing-apk-smoke.sh"
      - name: Upload installation evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-install-evidence-api-${{ inputs.android_api }}-${{ github.run_number }}
          path: native-install-reports/
          if-no-files-found: warn
          retention-days: 14
